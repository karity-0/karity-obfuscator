name: CI

on:
  push:
    branches: [main, dev, future]
  pull_request:
    branches: [main, dev, future]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Lua
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3

      - name: Prepare config
        shell: bash
        run: |
          cp config.example.json config.json

      - name: Run shared verification suite
        run: python test/run_ci.py
