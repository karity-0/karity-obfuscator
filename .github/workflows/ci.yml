name: CI

on:
  push:
    branches: [main, dev, future]
  workflow_dispatch:
  pull_request:
    branches: [main, dev, future]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifest and plan affected checks
        id: plan
        env:
          VERIFICATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          matrix=$(python test/run_ci.py --github --matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          python test/run_verification_regression.py

  test:
    needs: plan
    name: test (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.shard }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
          allow-prereleases: ${{ matrix.python == '3.15' }}

      - uses: step-security/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: leafo/gh-actions-lua@v13
        if: runner.os == 'Windows'
        with:
          luaVersion: "5.3.6"

      - name: Prepare bundled Lua
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -LiteralPath (Get-Command lua).Source -Destination bin/lua.exe -Force
          Copy-Item -LiteralPath (Get-Command luac).Source -Destination bin/luac53.exe -Force
          & .\bin\lua.exe -v

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Install Lua
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3

      - name: Prepare config
        shell: bash
        run: |
          cp config.example.json config.json

      - name: Verify test Lua runtimes
        run: >-
          python -c "import sys, subprocess; sys.path.insert(0, 'test');
          from lua_runtime import lua_executable, luac_executable;
          from lupa.lua51 import LuaRuntime as Lua51;
          from lupa.lua53 import LuaRuntime as Lua53;
          assert Lua51().eval('_VERSION') == 'Lua 5.1';
          assert Lua53().eval('_VERSION') == 'Lua 5.3';
          subprocess.run([lua_executable(), '-v'], check=True);
          subprocess.run([luac_executable(), '-v'], check=True)"

      - name: Run selected verification shard
        env:
          KARITY_CHECK_SELECTION: ${{ toJSON(matrix.selection) }}
        run: python test/run_ci.py --selection-env KARITY_CHECK_SELECTION --keep-going

      - name: Save check timings and replayable failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ strategy.job-index }}-${{ matrix.os }}-${{ matrix.python }}
          path: |
            local/verification/report-*.json
            local/verification/failures/
          if-no-files-found: ignore
          retention-days: 7
