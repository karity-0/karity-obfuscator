<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lua Obfuscator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="window-root">
  <div class="titlebar" id="titlebar">
    <div class="titlebar-drag pywebview-drag-region">
      <span class="titlebar-glyph">λ</span>
      <span class="titlebar-title">lua-obfuscator</span>
    </div>
    <div class="titlebar-controls">
      <button id="win-min" class="win-btn" title="최소화">─</button>
      <button id="win-max" class="win-btn" title="최대화">▢</button>
      <button id="win-close" class="win-btn win-close" title="닫기">✕</button>
    </div>
  </div>

  <div class="app">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-sub">PIPELINE CONFIG</span>
    </div>

    <section class="panel">
      <header class="panel-head">
        <span class="panel-title">PIPELINE OPTIONS</span>
        <span class="panel-hint">옵션 설정</span>
      </header>
      
      <ol id="pipeline-options-list" class="pass-list">
        <li class="pass-item" data-hint="생성되는 바이트코드 자체에 추가적인 내장 데이터 난독화 처리를 적용합니다.">
          <label class="pass-label">
            <input type="checkbox" class="opt-checkbox" id="opt-bytecode">
            <div class="pass-info">
              <span class="pass-name">Bytecode Obfuscation</span>
            </div>
          </label>
        </li>
        <li class="pass-item" data-hint="출력된 스크립트에 포함된 모든 문자열을 난독화합니다.">
          <label class="pass-label">
            <input type="checkbox" class="opt-checkbox" id="opt-string">
            <div class="pass-info">
              <span class="pass-name">String Obfuscation</span>
            </div>
          </label>
        </li>
        <li class="pass-item" data-hint="출력된 스크립트에 포함된 모든 참/거짓 조건을 난독화합니다.">
          <label class="pass-label">
            <input type="checkbox" class="opt-checkbox" id="opt-boolean">
            <div class="pass-info">
              <span class="pass-name">Boolean Obfuscation</span>
            </div>
          </label>
        </li>
        <li class="pass-item" data-hint="출력된 스크립트에 포함된 모든 숫자를 난독화합니다.">
          <label class="pass-label">
            <input type="checkbox" class="opt-checkbox" id="opt-number">
            <div class="pass-info">
              <span class="pass-name">Number Obfuscation</span>
            </div>
          </label>
        </li>
        <li class="pass-item" data-hint="출력된 스크립트에 포함된 모든 테이블을 난독화합니다.">
          <label class="pass-label">
            <input type="checkbox" class="opt-checkbox" id="opt-table">
            <div class="pass-info">
              <span class="pass-name">Table Obfuscation</span>
            </div>
          </label>
        </li>
        <li class="pass-item" data-hint="출력된 스크립트에 포함된 모든 함수를 난독화합니다.">
          <label class="pass-label">
            <input type="checkbox" class="opt-checkbox" id="opt-function">
            <div class="pass-info">
              <span class="pass-name">Function Obfuscation</span>
            </div>
          </label>
        </li>
        <li class="pass-item" data-hint="디버거를 감지하는 보호 코드를 추가합니다.">
          <label class="pass-label">
            <input type="checkbox" class="opt-checkbox" id="opt-anti-debug">
            <div class="pass-info">
              <span class="pass-name">Anti-Debug Wrapper</span>
            </div>
          </label>
        </li>
      </ol>
    </section>

    <section class="panel">
      <header class="panel-head">
        <span class="panel-title">VM PROTECTION</span>
        <span class="panel-hint">VM 보호 옵션</span>
      </header>

      <ol id="vm-protection-list" class="pass-list">
        <li class="pass-item" data-hint="가짜 핸들러를 삽입하여 분석을 방해합니다.">
          <label class="pass-label">
            <input type="checkbox" class="vmopt-checkbox" id="vmopt-fake-handlers" checked>
            <div class="pass-info">
              <span class="pass-name">Fake Handlers</span>
            </div>
          </label>
        </li>
        <li class="pass-item" data-hint="핸들러 구조를 변형하여 정적 분석을 어렵게 만듭니다.">
          <label class="pass-label">
            <input type="checkbox" class="vmopt-checkbox" id="vmopt-mutate-handlers" checked>
            <div class="pass-info">
              <span class="pass-name">Handler Mutation</span>
            </div>
          </label>
        </li>
        <li class="pass-item" data-hint="실행에 영향을 주지 않는 더미 명령어를 바이트코드 사이에 삽입합니다.">
          <label class="pass-label">
            <input type="checkbox" class="vmopt-checkbox" id="vmopt-junk-instructions" checked>
            <div class="pass-info">
              <span class="pass-name">Junk Instructions</span>
            </div>
          </label>
        </li>
      </ol>

      <div class="slider-row" data-hint="명령어 사이마다 더미 명령어가 삽입될 확률입니다. 높이면 분석이 어려워지지만 코드 크기가 커집니다.">
        <div class="slider-head">
          <span class="slider-label">Junk Rate</span>
          <span id="vmopt-junk-rate-value" class="slider-value">0.15</span>
        </div>
        <input type="range" id="vmopt-junk-rate" class="slider"
               min="0" max="0.5" step="0.01" value="0.15">
      </div>
    </section>

    <footer class="sidebar-footer">
      <button id="save-config-btn" class="btn btn-ghost">설정 저장</button>
      <div id="config-status" class="config-status"></div>
    </footer>
  </aside>

  <main class="main">
    <div class="pipeline-strip" id="pipeline-strip">
      <div class="pipeline-empty">선택된 옵션 없음</div>
    </div>

    <div class="editors">
      <section class="editor-pane">
        <header class="editor-head">
          <span class="editor-title">INPUT</span>
          <div class="editor-actions">
            <span id="input-filename" class="filename"></span>
            <button id="open-file-btn" class="btn btn-small">파일 열기</button>
            <button id="clear-input-btn" class="btn btn-small btn-ghost">지우기</button>
          </div>
        </header>
        <textarea id="input-script" class="editor" spellcheck="false"
          placeholder="-- Lua 스크립트를 입력하거나 파일을 여세요&#10;print(&quot;hello world&quot;)"></textarea>
      </section>

      <section class="editor-pane">
        <header class="editor-head">
          <span class="editor-title">OUTPUT</span>
          <div class="editor-actions">
            <span id="elapsed-label" class="filename"></span>
            <button id="copy-output-btn" class="btn btn-small btn-ghost">복사</button>
            <button id="save-output-btn" class="btn btn-small">저장</button>
          </div>
        </header>
        <textarea id="output-script" class="editor editor-output" spellcheck="false" readonly
          placeholder="-- 결과가 여기에 표시됩니다"></textarea>
      </section>
    </div>

    <div class="run-bar">
      <div id="status-msg" class="status-msg">대기 중</div>
      <button id="run-btn" class="btn btn-primary">
        <span class="btn-icon">▶</span> 난독화 실행
      </button>
    </div>
  </main>
  </div>
</div>

<div id="tooltip" class="tooltip-box"></div>

<script src="app.js"></script>
</body>
</html>
